services:
  - type: web
    name: sems-web
    runtime: static
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    staticPublishPath: ./apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
